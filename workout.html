
<!DOCTYPE html>
<!-- saved from url=(0057)https://ksa9960-dotcom.github.io/snowman-car/workout.html -->
<html lang="ko"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="다경운동일지">
<meta name="theme-color" content="#1a1a2e">
<!-- ✅ PWA manifest 인라인 (별도 파일 필요없음!) -->
<link rel="manifest" id="manifestLink" href="blob:https://ksa9960-dotcom.github.io/c00a02b9-b0e1-4dec-a7cd-dd22e3f661a7">
<title>다경운동일지 ♥</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --primary: #4f46e5;
    --primary-light: #6366f1;
    --success: #10b981;
    --warning: #f59e0b;
    --danger: #ef4444;
    --pink: #ec4899;
    --bg: #0f0f1a;
    --card: #1a1a2e;
    --card2: #16213e;
    --text: #e2e8f0;
    --text-muted: #94a3b8;
    --border: #2d3748;
    --radius: 14px;
  }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    min-height: 100vh;
    padding-bottom: 80px;
  }
  .tab-nav {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: var(--card);
    border-top: 1px solid var(--border);
    display: flex;
    z-index: 100;
    padding-bottom: env(safe-area-inset-bottom);
  }
  .tab-btn {
    flex: 1;
    padding: 10px 2px 8px;
    background: none;
    border: none;
    color: var(--text-muted);
    font-size: 9px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    transition: color 0.2s;
  }
  .tab-btn.active { color: var(--primary-light); }
  .tab-btn svg { width: 20px; height: 20px; }
  .header {
    background: linear-gradient(135deg, #1a1a2e, #16213e);
    padding: 20px 16px 16px;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 50;
  }
  .header h1 { font-size: 19px; font-weight: 700; }
  .header .date-str { font-size: 13px; color: var(--text-muted); margin-top: 2px; }
  .page { display: none; padding: 16px; }
  .page.active { display: block; }
  .card {
    background: var(--card);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 12px;
    border: 1px solid var(--border);
  }
  .card-title {
    font-size: 12px;
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 12px;
  }
  label { display: block; font-size: 13px; color: var(--text-muted); margin-bottom: 5px; margin-top: 12px; }
  label:first-of-type { margin-top: 0; }
  input[type=text], input[type=time], input[type=date], input[type=number], select, textarea {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    padding: 10px 12px;
    font-size: 15px;
    outline: none;
    transition: border-color 0.2s;
    -webkit-appearance: none;
  }
  input:focus, select:focus, textarea:focus { border-color: var(--primary-light); }
  textarea { resize: none; min-height: 70px; }
  select option { background: #1a1a2e; }
  .intensity-group { display: flex; gap: 8px; margin-top: 4px; }
  .intensity-btn {
    flex: 1; padding: 9px 4px;
    border-radius: 10px; border: 2px solid var(--border);
    background: var(--bg); color: var(--text-muted);
    font-size: 12px; font-weight: 600; cursor: pointer;
    transition: all 0.2s; text-align: center;
  }
  .intensity-btn.low.selected { border-color: var(--success); color: var(--success); background: #10b98115; }
  .intensity-btn.mid.selected { border-color: var(--warning); color: var(--warning); background: #f59e0b15; }
  .intensity-btn.high.selected { border-color: var(--danger); color: var(--danger); background: #ef444415; }
  .exercise-list { display: flex; flex-direction: column; gap: 8px; }
  .exercise-item {
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 12px; padding: 12px;
    display: flex; align-items: center; gap: 12px;
  }
  .exercise-item.done { opacity: 0.6; }
  .exercise-item.done .ex-name { text-decoration: line-through; }
  .check-circle {
    width: 28px; height: 28px; border-radius: 50%;
    border: 2px solid var(--border); background: none;
    cursor: pointer; display: flex; align-items: center;
    justify-content: center; transition: all 0.2s; flex-shrink: 0;
  }
  .check-circle.done { background: var(--success); border-color: var(--success); }
  .check-circle svg { width: 14px; height: 14px; stroke: white; display: none; }
  .check-circle.done svg { display: block; }
  .ex-info { flex: 1; min-width: 0; }
  .ex-name { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ex-meta { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
  .ex-delete { background: none; border: none; color: var(--text-muted); cursor: pointer; padding: 4px; border-radius: 8px; }
  .btn {
    display: block; width: 100%; padding: 14px;
    border-radius: 12px; border: none; font-size: 16px;
    font-weight: 600; cursor: pointer; transition: all 0.15s; text-align: center;
  }
  .btn-primary { background: var(--primary); color: white; }
  .btn-primary:active { transform: scale(0.98); }
  .btn-pink { background: var(--pink); color: white; }
  .btn-outline {
    background: none; border: 1.5px solid var(--border);
    color: var(--text); padding: 10px; font-size: 14px;
  }
  .btn + .btn { margin-top: 8px; }
  /* 수강권 카드 */
  .ticket-card {
    background: linear-gradient(135deg, #1e1b4b, #2d1b3d);
    border: 1px solid var(--pink);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 12px;
    position: relative;
    overflow: hidden;
  }
  .ticket-card::before {
    content: '♥';
    position: absolute;
    right: 14px; top: 10px;
    font-size: 40px;
    opacity: 0.1;
    color: var(--pink);
  }
  .ticket-name { font-size: 13px; color: var(--text-muted); margin-bottom: 4px; }
  .ticket-remain { font-size: 36px; font-weight: 900; color: var(--pink); line-height: 1; }
  .ticket-total { font-size: 13px; color: var(--text-muted); margin-top: 2px; }
  .ticket-bar { background: var(--border); border-radius: 10px; height: 6px; overflow: hidden; margin-top: 10px; }
  .ticket-fill { height: 100%; background: linear-gradient(90deg, var(--pink), #f472b6); border-radius: 10px; transition: width 0.4s; }
  .ticket-actions { display: flex; gap: 8px; margin-top: 12px; }
  .ticket-btn {
    flex: 1; padding: 8px; border-radius: 10px; border: none;
    font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.15s;
  }
  .ticket-btn-use { background: var(--pink); color: white; }
  .ticket-btn-use:active { transform: scale(0.97); }
  .ticket-btn-del { background: var(--bg); border: 1px solid var(--border); color: var(--text-muted); }
  .ticket-btn-edit { background: var(--bg); border: 1px solid var(--pink); color: var(--pink); }
  /* ── 달력 ──────────────────────────────────── */
  .cal-wrap {
    background: var(--card);
    border-bottom: 1px solid var(--border);
    padding: 16px 16px 10px;
    position: sticky; top: 56px; z-index: 40;
  }
  .cal-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 12px;
  }
  .cal-title { font-size: 17px; font-weight: 700; }
  .cal-nav {
    background: none; border: none; color: var(--text);
    font-size: 26px; cursor: pointer; padding: 0 8px; line-height: 1;
  }
  .cal-weekdays {
    display: grid; grid-template-columns: repeat(7, 1fr);
    text-align: center; font-size: 12px; font-weight: 600;
    color: var(--text-muted); margin-bottom: 6px;
  }
  .cal-grid {
    display: grid; grid-template-columns: repeat(7, 1fr);
    gap: 2px 0;
  }
  .cal-day {
    display: flex; flex-direction: column; align-items: center;
    padding: 4px 2px; cursor: pointer; border-radius: 50%; position: relative;
    min-height: 40px; justify-content: center;
  }
  .cal-day:active { opacity: 0.7; }
  .cal-day.other-month { opacity: 0.25; }
  .cal-day.today .cal-day-num {
    background: var(--primary-light); color: white;
    border-radius: 50%; width: 28px; height: 28px;
    display: flex; align-items: center; justify-content: center;
  }
  .cal-day.selected .cal-day-num {
    background: var(--primary); color: white;
    border-radius: 50%; width: 28px; height: 28px;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 2px 8px #4f46e560;
  }
  .cal-day.sun .cal-day-num-plain { color: #ef4444; }
  .cal-day.sat .cal-day-num-plain { color: #6366f1; }
  .cal-day-num, .cal-day-num-plain {
    font-size: 14px; font-weight: 500; line-height: 28px;
    width: 28px; height: 28px; text-align: center; border-radius: 50%;
  }
  .cal-dots { display: flex; gap: 2px; justify-content: center; margin-top: 2px; min-height: 5px; }
  .cal-dot { width: 4px; height: 4px; border-radius: 50%; }
  .cal-dot.res { background: var(--primary-light); }
  .cal-dot.sch { background: var(--success); }

  /* 선택 날짜 레이블 */
  .cal-day-label { font-size: 16px; font-weight: 700; }
  .cal-add-btn {
    padding: 7px 14px; border-radius: 20px;
    background: var(--primary); color: white;
    border: none; font-size: 13px; font-weight: 600; cursor: pointer;
  }

  /* 일정 카드 */
  .slot-card {
    border-radius: var(--radius); padding: 14px; margin-bottom: 10px;
    border-left: 4px solid;
  }
  .slot-card.res-slot {
    background: linear-gradient(135deg,#1e1b4b,#1a1a2e);
    border-left-color: var(--primary-light);
  }
  .slot-card.sch-slot {
    background: linear-gradient(135deg,#1a2e1e,#1a1a2e);
    border-left-color: var(--success);
  }
  .slot-time { font-size: 20px; font-weight: 800; margin-bottom: 4px; }
  .slot-card.res-slot .slot-time { color: var(--primary-light); }
  .slot-card.sch-slot .slot-time { color: var(--success); }
  .slot-name { font-size: 15px; font-weight: 600; margin-bottom: 2px; }
  .slot-meta { font-size: 12px; color: var(--text-muted); }
  .slot-badge {
    display: inline-block; font-size: 11px; font-weight: 600;
    padding: 2px 8px; border-radius: 20px; margin-bottom: 6px;
  }
  .slot-badge.res { background: #4f46e530; color: var(--primary-light); }
  .slot-badge.sch { background: #10b98130; color: var(--success); }
  .slot-actions { display: flex; gap: 8px; margin-top: 10px; }
  .slot-btn-edit {
    flex:1; padding:7px; border-radius:10px; border:1px solid var(--border);
    background:none; color:var(--text-muted); font-size:13px; font-weight:600; cursor:pointer;
  }
  .slot-btn-del {
    flex:1; padding:7px; border-radius:10px; border:1px solid #ef444440;
    background:none; color:var(--danger); font-size:13px; font-weight:600; cursor:pointer;
  }

  /* 모달 바텀시트 */
  .modal-backdrop {
    display: none; position: fixed; inset: 0;
    background: #00000070; z-index: 200;
  }
  .modal-backdrop.open { display: block; }
  .modal-sheet {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: var(--card); border-radius: 20px 20px 0 0;
    padding: 20px 20px calc(20px + env(safe-area-inset-bottom));
    z-index: 201; max-height: 90vh; overflow-y: auto;
    transform: translateY(100%); transition: transform 0.3s ease;
  }
  .modal-sheet.open { transform: translateY(0); }

  /* 섹션 구분 탭 */
  .res-type-tabs { display:flex; gap:0; border-radius:12px; overflow:hidden; border:1.5px solid var(--border); }
  .res-type-tab {
    flex:1; padding:10px; background:none; border:none;
    color:var(--text-muted); font-size:14px; font-weight:600; cursor:pointer; transition:all 0.2s;
  }
  .res-type-tab.active { background:var(--primary); color:white; }
  .log-card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 14px; margin-bottom: 10px;
  }
  .log-date { font-size: 12px; color: var(--text-muted); margin-bottom: 6px; }
  .log-instructor { font-size: 14px; font-weight: 700; color: var(--primary-light); margin-bottom: 4px; }
  .log-exercises { font-size: 13px; color: var(--text); margin-bottom: 6px; }
  .log-intensity { display: inline-block; padding: 2px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; }
  .log-intensity.low { background: #10b98120; color: var(--success); }
  .log-intensity.mid { background: #f59e0b20; color: var(--warning); }
  .log-intensity.high { background: #ef444420; color: var(--danger); }
  .log-memo { font-size: 12px; color: var(--text-muted); margin-top: 6px; border-top: 1px solid var(--border); padding-top: 6px; }
  .log-ticket { display: inline-block; padding: 2px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; background: #ec489920; color: var(--pink); margin-left: 6px; }
  .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
  .stat-item { background: var(--card2); border-radius: 12px; padding: 14px; text-align: center; }
  .stat-num { font-size: 28px; font-weight: 800; color: var(--primary-light); }
  .stat-label { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
  .progress-bar { background: var(--border); border-radius: 10px; height: 8px; overflow: hidden; margin-top: 6px; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, var(--primary), var(--primary-light)); border-radius: 10px; transition: width 0.4s; }
  .section-title {
    font-size: 18px; font-weight: 700; margin-bottom: 14px;
    display: flex; align-items: center; gap: 8px;
  }
  .badge {
    background: var(--primary); color: white;
    font-size: 11px; padding: 2px 8px; border-radius: 20px; font-weight: 600;
  }
  .empty-state { text-align: center; padding: 40px 20px; color: var(--text-muted); }
  .empty-state .emoji { font-size: 40px; margin-bottom: 10px; }
  .empty-state p { font-size: 14px; }
  .session-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .session-complete-btn {
    background: var(--success); color: white; border: none;
    padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: 600; cursor: pointer;
  }
</style>
</head>
<body>

<div class="header">
  <h1>다경운동일지 ♥</h1>
  <div class="date-str" id="headerDate">2026년 4월 20일 (월)</div>
</div>

<!-- 오늘 운동 -->
<div class="page active" id="page-today">
  <div id="todayReservation"></div>
  <div id="todayTicketSummary"></div>

  <div class="card">
    <div class="session-header">
      <span class="card-title">오늘 운동 세션</span>
      <button class="session-complete-btn" onclick="completeSession()">완료 저장</button>
    </div>
    <label>강사명</label>
    <input type="text" id="instructor" placeholder="예) 김민준 트레이너">
    <label>사용할 수강권</label>
    <select id="sessionTicket"><option value="">-- 수강권 선택 (선택사항) --</option></select>
    <label>강도</label>
    <div class="intensity-group">
      <button class="intensity-btn low" onclick="selectIntensity(&#39;low&#39;)">🟢 저강도</button>
      <button class="intensity-btn mid" onclick="selectIntensity(&#39;mid&#39;)">🟡 중강도</button>
      <button class="intensity-btn high" onclick="selectIntensity(&#39;high&#39;)">🔴 고강도</button>
    </div>
    <label>메모</label>
    <textarea id="memo" placeholder="오늘 느낀점, 특이사항 등..."></textarea>
  </div>

  <div class="card">
    <div class="section-title">
      운동 목록
      <span class="badge" id="exCountBadge">0</span>
    </div>
    <div class="exercise-list" id="exerciseList"><div style="text-align:center;padding:20px;color:var(--text-muted);font-size:13px">운동을 추가해보세요!</div></div>
    <div style="margin-top:12px">
      <input type="text" id="exName" placeholder="운동명 (예: 스쿼트)" style="margin-bottom:8px">
      <!-- 세트 · 횟수 · kg -->
      <div style="display:flex; gap:8px; margin-bottom:8px">
        <div style="flex:1"><input type="number" id="exSets" placeholder="세트" min="1"></div>
        <div style="flex:1"><input type="number" id="exReps" placeholder="횟수(회)" min="1"></div>
        <div style="flex:1"><input type="number" id="exWeight" placeholder="kg (선택)" min="0" step="0.5"></div>
      </div>
      <!-- 시간: 분 단위로 입력, 자동으로 X시간 Y분 표시 -->
      <div style="display:flex; gap:8px; margin-bottom:8px; align-items:center">
        <div style="flex:1; position:relative">
          <input type="number" id="exMinutes" placeholder="운동 시간 입력" min="1" max="999"
            style="padding-right:36px" oninput="updateTimePreview()">
          <span style="position:absolute;right:12px;top:50%;transform:translateY(-50%);
            font-size:13px;color:var(--text-muted);pointer-events:none">분</span>
        </div>
        <div id="timePreview" style="font-size:13px;color:var(--primary-light);
          white-space:nowrap;min-width:60px;font-weight:600"></div>
      </div>
      <select id="exCategory">
        <option value="">부위 선택</option>
        <option value="가슴">가슴</option>
        <option value="등">등</option>
        <option value="하체">하체</option>
        <option value="어깨">어깨</option>
        <option value="팔">팔</option>
        <option value="복근">복근</option>
        <option value="유산소">유산소</option>
        <option value="전신">전신</option>
      </select>
      <button class="btn btn-outline" style="margin-top:8px" onclick="addExercise()">+ 운동 추가</button>
    </div>
  </div>

  <div class="card" id="progressCard" style="display:none">
    <div class="card-title">오늘 진행률</div>
    <div class="session-header">
      <span id="progressText" style="font-size:14px"></span>
      <span id="progressPct" style="font-size:18px; font-weight:700; color:var(--primary-light)"></span>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
  </div>
</div>

<!-- 수강권 -->
<div class="page" id="page-ticket">
  <div class="section-title">🎫 수강권 관리</div>

  <!-- 수강권 추가 폼 -->
  <div class="card">
    <div class="card-title" id="ticketFormTitle">새 수강권 등록</div>
    <input type="hidden" id="editTicketId" value="">
    <label>수강권 이름</label>
    <input type="text" id="ticketName" placeholder="예) 필라테스, PT, 요가...">
    <label>총 횟수</label>
    <input type="number" id="ticketTotal" placeholder="예) 100" min="1">
    <label>이미 사용한 횟수</label>
    <input type="number" id="ticketUsed" placeholder="0" min="0" value="0">
    <label>등록일</label>
    <input type="date" id="ticketStartDate">
    <label>메모</label>
    <input type="text" id="ticketNote" placeholder="예) 만료일 2026-12-31">
    <button class="btn btn-pink" style="margin-top:14px" onclick="saveTicket()">수강권 저장</button>
    <button class="btn btn-outline" id="cancelEditBtn" style="display:none;margin-top:8px" onclick="cancelTicketEdit()">취소</button>
  </div>

  <!-- 수강권 목록 -->
  <div class="section-title" style="margin-top:4px">등록된 수강권</div>
  <div id="ticketList"><div class="empty-state"><div class="emoji">🎫</div><p>수강권을 등록해보세요</p></div></div>
</div>

<!-- 예약 -->
<div class="page" id="page-reservation">

  <!-- 달력 영역 -->
  <div class="cal-wrap">
    <div class="cal-header">
      <button class="cal-nav" onclick="calMove(-1)">&#8249;</button>
      <span class="cal-title" id="calTitle"></span>
      <button class="cal-nav" onclick="calMove(1)">&#8250;</button>
    </div>
    <div class="cal-weekdays">
      <span style="color:#ef4444">일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span style="color:#6366f1">토</span>
    </div>
    <div class="cal-grid" id="calGrid"></div>
  </div>

  <!-- 선택된 날짜의 일정 목록 -->
  <div style="padding:0 16px 16px">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">

  </button>

  </button>

    기록
  </button>
  <button class="tab-btn" onclick="switchTab(&#39;stats&#39;, this)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>
    통계
  </button>

<script>
// ── 데이터 ───────────────────────────────────────────
let exercises   = JSON.parse(localStorage.getItem('exercises')    || '[]');
let reservations= JSON.parse(localStorage.getItem('reservations') || '[]');
let schedules   = JSON.parse(localStorage.getItem('schedules')    || '[]'); // 개인 약속
let history     = JSON.parse(localStorage.getItem('history')      || '[]');
let tickets     = JSON.parse(localStorage.getItem('tickets')      || '[]');
let intensity   = '';

function save() {
  localStorage.setItem('exercises',    JSON.stringify(exercises));
  localStorage.setItem('reservations', JSON.stringify(reservations));
  localStorage.setItem('schedules',    JSON.stringify(schedules));
  localStorage.setItem('history',      JSON.stringify(history));
  localStorage.setItem('tickets',      JSON.stringify(tickets));
}

// ── 날짜 ─────────────────────────────────────────────
const today = new Date();
const todayStr = today.toISOString().split('T')[0];
const weekdays = ['일','월','화','수','목','금','토'];
document.getElementById('headerDate').textContent =
  `${today.getFullYear()}년 ${today.getMonth()+1}월 ${today.getDate()}일 (${weekdays[today.getDay()]})`;
document.getElementById('resDate').value  = todayStr;
document.getElementById('schDate').value  = todayStr;
document.getElementById('ticketStartDate').value = todayStr;

// ── 탭 전환 ──────────────────────────────────────────
function switchTab(name, btn) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('page-' + name).classList.add('active');
  btn.classList.add('active');
  if (name === 'history')     renderHistory();
  if (name === 'stats')       renderStats();
  if (name === 'reservation') { renderCalendar(); renderAllSchedules(); }
  if (name === 'ticket')      renderTickets();
}

// ── 예약/약속 폼 탭 전환 ──────────────────────────────
function switchFormTab(tab) {
  document.getElementById('resFormCard').style.display = tab === 'res' ? 'block' : 'none';
  document.getElementById('schFormCard').style.display = tab === 'sch' ? 'block' : 'none';
  document.getElementById('formTabRes').classList.toggle('active', tab === 'res');
  document.getElementById('formTabSch').classList.toggle('active', tab === 'sch');
}

// ── 달력 ──────────────────────────────────────────────
let calYear  = today.getFullYear();
let calMonth = today.getMonth();        // 0-based
let selectedDate = todayStr;            // 선택된 날짜 (YYYY-MM-DD)

function calMove(dir) {
  calMonth += dir;
  if (calMonth < 0)  { calMonth = 11; calYear--; }
  if (calMonth > 11) { calMonth = 0;  calYear++; }
  renderCalendar();
}

function renderCalendar() {
  document.getElementById('calTitle').textContent =
    `${calYear}년 ${calMonth + 1}월`;

  // 이 달에 일정 있는 날짜 집합
  const monthStr = `${calYear}-${String(calMonth+1).padStart(2,'0')}`;
  const resDays  = new Set(reservations.filter(r => r.date.startsWith(monthStr)).map(r => r.date));
  const schDays  = new Set(schedules.filter(s => s.date.startsWith(monthStr)).map(s => s.date));

  const firstDay  = new Date(calYear, calMonth, 1).getDay(); // 0=일
  const lastDate  = new Date(calYear, calMonth + 1, 0).getDate();
  const prevLast  = new Date(calYear, calMonth, 0).getDate();

  let html = '';
  let dayCount = 0;

  // 이전 달 채우기
  for (let i = firstDay - 1; i >= 0; i--) {
    const d = prevLast - i;
    html += `<div class="cal-day other-month"><span class="cal-day-num-plain">${d}</span><div class="cal-dots"></div></div>`;
    dayCount++;
  }

  // 이번 달
  for (let d = 1; d <= lastDate; d++) {
    const ds = `${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const dow = (firstDay + d - 1) % 7;
    const isTod = ds === todayStr;
    const isSel = ds === selectedDate;
    const sunCls = dow === 0 ? 'sun' : dow === 6 ? 'sat' : '';

    let numHtml;
    if (isSel) {
      numHtml = `<span class="cal-day-num">${d}</span>`;
    } else if (isTod) {
      numHtml = `<span class="cal-day-num" style="background:var(--primary-light)60;color:var(--primary-light)">${d}</span>`;
    } else {
      const col = dow === 0 ? 'color:#ef4444' : dow === 6 ? 'color:#6366f1' : '';
      numHtml = `<span class="cal-day-num-plain" style="${col}">${d}</span>`;
    }

    const dots = [
      resDays.has(ds) ? '<span class="cal-dot res"></span>' : '',
      schDays.has(ds) ? '<span class="cal-dot sch"></span>' : ''
    ].join('');

    html += `<div class="cal-day ${sunCls}" onclick="selectCalDate('${ds}')">
      ${numHtml}
      <div class="cal-dots">${dots}</div>
    </div>`;
    dayCount++;
  }

  // 다음 달 채우기 (6주 고정)
  const total = Math.ceil(dayCount / 7) * 7;
  let nd = 1;
  while (dayCount < total) {
    html += `<div class="cal-day other-month"><span class="cal-day-num-plain">${nd++}</span><div class="cal-dots"></div></div>`;
    dayCount++;
  }

  document.getElementById('calGrid').innerHTML = html;
  updateDayLabel();
}

function selectCalDate(ds) {
  selectedDate = ds;
  renderCalendar();
  renderAllSchedules();
}

function updateDayLabel() {
  const d = new Date(selectedDate + 'T00:00:00');
  const isToday = selectedDate === todayStr;
  document.getElementById('calDayLabel').innerHTML =
    `${d.getMonth()+1}월 ${d.getDate()}일 (${weekdays[d.getDay()]})` +
    (isToday ? ' <span style="color:var(--success);font-size:13px">오늘</span>' : '');
}

// ── 모달 열기/닫기 ────────────────────────────────────
function openResModal(tab) {
  document.getElementById('resDate').value = selectedDate;
  document.getElementById('schDate').value = selectedDate;
  switchFormTab(tab || 'res');
  document.getElementById('resModalBackdrop').classList.add('open');
  document.getElementById('resModal').classList.add('open');
}
function closeResModal() {
  document.getElementById('resModalBackdrop').classList.remove('open');
  document.getElementById('resModal').classList.remove('open');
}

// 날짜 포맷 헬퍼
function fmtDate(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  return `${d.getMonth()+1}월 ${d.getDate()}일 (${weekdays[d.getDay()]})`;
}

// ── 강도 ─────────────────────────────────────────────
function selectIntensity(val) {
  intensity = val;
  document.querySelectorAll('.intensity-btn').forEach(b => b.classList.remove('selected'));
  document.querySelector(`.intensity-btn.${val}`).classList.add('selected');
}

// ── 시간 미리보기 (분 → X시간 Y분 변환) ──────────────────
function updateTimePreview() {
  const mins = parseInt(document.getElementById('exMinutes').value) || 0;
  const preview = document.getElementById('timePreview');
  if (!mins) { preview.textContent = ''; return; }
  if (mins < 60) {
    preview.textContent = mins + '분';
  } else {
    const h = Math.floor(mins / 60);
    const m = mins % 60;
    preview.textContent = h + '시간' + (m ? ' ' + m + '분' : '');
  }
}

// 분 숫자를 "X시간 Y분" 문자열로 변환하는 헬퍼
function formatMinutes(mins) {
  mins = parseInt(mins) || 0;
  if (!mins) return '';
  if (mins < 60) return mins + '분';
  const h = Math.floor(mins / 60);
  const m = mins % 60;
  return h + '시간' + (m ? ' ' + m + '분' : '');
}

// ── 운동 추가 ─────────────────────────────────────────
function addExercise() {
  const name = document.getElementById('exName').value.trim();
  if (!name) { alert('운동명을 입력해주세요'); return; }
  exercises.push({
    id: Date.now(),
    name,
    sets:     document.getElementById('exSets').value || '',
    reps:     document.getElementById('exReps').value || '',    // 횟수(회)
    minutes:  document.getElementById('exMinutes').value || '', // 시간(분)
    weight:   document.getElementById('exWeight').value || '',
    category: document.getElementById('exCategory').value,
    done: false
  });
  // 입력 필드 초기화
  ['exName','exSets','exReps','exMinutes','exWeight'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('exCategory').value = '';
  document.getElementById('timePreview').textContent = '';
  save(); renderExercises();
}

function toggleExercise(id) {
  const ex = exercises.find(e => e.id === id);
  if (ex) { ex.done = !ex.done; save(); renderExercises(); }
}

function deleteExercise(id) {
  exercises = exercises.filter(e => e.id !== id);
  save(); renderExercises();
}

function renderExercises() {
  const list  = document.getElementById('exerciseList');
  const badge = document.getElementById('exCountBadge');
  const done  = exercises.filter(e => e.done).length;
  badge.textContent = exercises.length;

  if (exercises.length === 0) {
    list.innerHTML = '<div style="text-align:center;padding:20px;color:var(--text-muted);font-size:13px">운동을 추가해보세요!</div>';
    document.getElementById('progressCard').style.display = 'none';
    return;
  }

  list.innerHTML = exercises.map(ex => {
    const meta = [
      ex.sets    ? ex.sets + '세트'              : '',
      ex.reps    ? ex.reps + '회'                : '',
      ex.minutes ? '⏱ ' + formatMinutes(ex.minutes) : '',
      ex.weight  ? ex.weight + 'kg'              : '',
      ex.category || ''
    ].filter(Boolean).join(' · ');
    return `
    <div class="exercise-item ${ex.done ? 'done' : ''}">
      <button class="check-circle ${ex.done ? 'done' : ''}" onclick="toggleExercise(${ex.id})">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>
      </button>
      <div class="ex-info">
        <div class="ex-name">${ex.name}</div>
        ${meta ? `<div class="ex-meta">${meta}</div>` : ''}
      </div>
      <button class="ex-delete" onclick="deleteExercise(${ex.id})">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>`;
  }).join('');

  document.getElementById('progressCard').style.display = 'block';
  const pct = Math.round((done / exercises.length) * 100);
  document.getElementById('progressText').textContent = `${done}/${exercises.length} 완료`;
  document.getElementById('progressPct').textContent  = pct + '%';
  document.getElementById('progressFill').style.width = pct + '%';
}

// ── 세션 완료 저장 ────────────────────────────────────
function completeSession() {
  if (exercises.length === 0) { alert('운동 목록이 비어있습니다'); return; }
  const instructor = document.getElementById('instructor').value.trim();
  const memo       = document.getElementById('memo').value.trim();
  const ticketId   = document.getElementById('sessionTicket').value;

  // 수강권 차감
  let ticketName = '';
  if (ticketId) {
    const t = tickets.find(t => t.id == ticketId);
    if (t) {
      const remain = t.total - t.used;
      if (remain <= 0) {
        alert(`"${t.name}" 수강권의 잔여 횟수가 없습니다!`);
        return;
      }
      t.used++;
      ticketName = t.name;
      save();
      renderTodayTicketSummary();
    }
  }

  history.unshift({
    id: Date.now(),
    date: todayStr,
    dateStr: document.getElementById('headerDate').textContent,
    instructor,
    intensity,
    exercises: JSON.parse(JSON.stringify(exercises)),
    memo,
    ticketId,
    ticketName,
    completedAt: new Date().toLocaleTimeString('ko-KR', {hour:'2-digit', minute:'2-digit'})
  });

  exercises = [];
  intensity = '';
  document.getElementById('instructor').value = '';
  document.getElementById('memo').value = '';
  document.getElementById('sessionTicket').value = '';
  document.querySelectorAll('.intensity-btn').forEach(b => b.classList.remove('selected'));
  save(); renderExercises();

  const msg = ticketName
    ? `✅ 운동 완료!\n🎫 "${ticketName}" 수강권 1회 차감\n잔여: ${tickets.find(t=>t.name===ticketName).total - tickets.find(t=>t.name===ticketName).used}회`
    : '✅ 운동 세션이 저장되었습니다!';
  alert(msg);
}

// ── 수강권 ──────────────────────────────────────────
function saveTicket() {
  const name  = document.getElementById('ticketName').value.trim();
  const total = parseInt(document.getElementById('ticketTotal').value);
  const used  = parseInt(document.getElementById('ticketUsed').value) || 0;
  const startDate = document.getElementById('ticketStartDate').value;
  const note  = document.getElementById('ticketNote').value.trim();
  const editId = document.getElementById('editTicketId').value;

  if (!name)      { alert('수강권 이름을 입력해주세요'); return; }
  if (!total || total < 1) { alert('총 횟수를 입력해주세요'); return; }
  if (used > total)        { alert('사용 횟수가 총 횟수보다 많습니다'); return; }

  if (editId) {
    // 수정
    const t = tickets.find(t => t.id == editId);
    if (t) { t.name = name; t.total = total; t.used = used; t.startDate = startDate; t.note = note; }
    cancelTicketEdit();
  } else {
    // 신규
    tickets.push({ id: Date.now(), name, total, used, startDate, note });
  }

  ['ticketName','ticketNote'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('ticketTotal').value = '';
  document.getElementById('ticketUsed').value  = '0';
  document.getElementById('ticketStartDate').value = todayStr;
  save();
  renderTickets();
  renderTodayTicketSummary();
  updateTicketSelect();
}

function useTicket(id) {
  const t = tickets.find(t => t.id === id);
  if (!t) return;
  const remain = t.total - t.used;
  if (remain <= 0) { alert('잔여 횟수가 없습니다!'); return; }
  if (!confirm(`"${t.name}" 1회 사용 하시겠어요?\n잔여: ${remain}회 → ${remain - 1}회`)) return;
  t.used++;
  save();
  renderTickets();
  renderTodayTicketSummary();
  updateTicketSelect();
}

function editTicket(id) {
  const t = tickets.find(t => t.id === id);
  if (!t) return;
  document.getElementById('editTicketId').value       = t.id;
  document.getElementById('ticketName').value         = t.name;
  document.getElementById('ticketTotal').value        = t.total;
  document.getElementById('ticketUsed').value         = t.used;
  document.getElementById('ticketStartDate').value    = t.startDate || todayStr;
  document.getElementById('ticketNote').value         = t.note || '';

function deleteTicket(id) {
  const t = tickets.find(t => t.id === id);
  if (!t) return;
  if (!confirm(`"${t.name}" 수강권을 삭제할까요?`)) return;
  tickets = tickets.filter(t => t.id !== id);
  save();
  renderTickets();
  renderTodayTicketSummary();
  updateTicketSelect();
}

function renderTickets() {
  const list = document.getElementById('ticketList');
  if (tickets.length === 0) {
    list.innerHTML = '<div class="empty-state"><div class="emoji">🎫</div><p>수강권을 등록해보세요</p></div>';
    return;
  }
  list.innerHTML = tickets.map(t => {
    const remain = t.total - t.used;
    const pct    = Math.round((remain / t.total) * 100);
    const isLow  = remain <= 10;
    return `
    <div class="ticket-card" ${isLow ? 'style="border-color:var(--danger)"' : ''}>
      <div class="ticket-name">🎫 ${t.name} ${isLow && remain > 0 ? '<span style="color:var(--danger);font-size:11px">잔여 적음!</span>' : ''} ${remain === 0 ? '<span style="color:var(--danger);font-size:11px">소진완료</span>' : ''}</div>
      <div class="ticket-remain">${remain}</div>
      <div class="ticket-total">/ ${t.total}회 중 ${t.used}회 사용</div>
      <div class="ticket-bar"><div class="ticket-fill" style="width:${pct}%"></div></div>
      ${t.note ? `<div style="font-size:12px;color:var(--text-muted);margin-top:8px">📝 ${t.note}</div>` : ''}
      <div class="ticket-actions">
        <button class="ticket-btn ticket-btn-use" onclick="useTicket(${t.id})" ${remain===0?'disabled style="opacity:0.4"':''}>− 1회 사용</button>
        <button class="ticket-btn ticket-btn-edit" onclick="editTicket(${t.id})">수정</button>
        <button class="ticket-btn ticket-btn-del" onclick="deleteTicket(${t.id})">삭제</button>
      </div>
    </div>`;
  }).join('');
}

function renderTodayTicketSummary() {
  const el = document.getElementById('todayTicketSummary');
  if (tickets.length === 0) { el.innerHTML = ''; return; }
  el.innerHTML = tickets.map(t => {
    const remain = t.total - t.used;
    const pct    = Math.round((remain / t.total) * 100);
    const color  = remain <= 10 ? 'var(--danger)' : 'var(--pink)';
    return `
    <div class="card" style="border-color:${color}20;background:linear-gradient(135deg,#1e1b3a,#1a1a2e);margin-bottom:8px">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div>
          <div style="font-size:12px;color:var(--text-muted)">🎫 ${t.name}</div>
          <div style="font-size:22px;font-weight:900;color:${color}">${remain}<span style="font-size:13px;font-weight:400;color:var(--text-muted)"> / ${t.total}회 남음</span></div>
        </div>
        <div style="font-size:24px;font-weight:800;color:${color};opacity:0.15">♥</div>
      </div>
      <div class="ticket-bar" style="margin-top:8px"><div class="ticket-fill" style="width:${pct}%;background:${color}"></div></div>
    </div>`;
  }).join('');
}

function updateTicketSelect() {
  const sel = document.getElementById('sessionTicket');
  const cur = sel.value;
  sel.innerHTML = '<option value="">-- 수강권 선택 (선택사항) --</option>';
  tickets.forEach(t => {
    const remain = t.total - t.used;
    const opt = document.createElement('option');
    opt.value = t.id;
    opt.textContent = `${t.name} (잔여 ${remain}회)`;
    if (remain === 0) opt.disabled = true;
    sel.appendChild(opt);
  });
  if (cur) sel.value = cur;
}

// ── 운동 예약 ────────────────────────────────────────
function addReservation() {
  const date       = document.getElementById('resDate').value;
  const time       = document.getElementById('resTime').value;
  const instructor = document.getElementById('resInstructor').value.trim();
  const type       = document.getElementById('resType').value.trim();
  const memo       = document.getElementById('resMemo').value.trim();
  const editId     = document.getElementById('editReservationId').value;

  if (!date || !time) { alert('날짜와 시간을 선택해주세요'); return; }

  if (editId) {
    const r = reservations.find(r => String(r.id) === String(editId));
    if (r) { r.date = date; r.time = time; r.instructor = instructor; r.type = type; r.memo = memo; }
    cancelReservationEdit();
  } else {
    reservations.push({ id: Date.now(), date, time, instructor, type, memo });
    document.getElementById('resTime').value       = '';
    document.getElementById('resInstructor').value = '';
    document.getElementById('resType').value       = '';
    document.getElementById('resMemo').value       = '';
  }
  reservations.sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));
  // 저장한 날짜로 달력 이동
  selectedDate = date;
  calYear  = parseInt(date.split('-')[0]);
  calMonth = parseInt(date.split('-')[1]) - 1;
  save(); closeResModal(); renderCalendar(); renderAllSchedules(); renderTodayReservation();
}

// ── 통합 목록 렌더링 (선택 날짜 기준) ────────────────
function renderAllSchedules() {
  const list = document.getElementById('reservationList');

  const filteredRes = reservations.filter(r => r.date === selectedDate);
  const filteredSch = schedules.filter(s => s.date === selectedDate);
  const combined = [
    ...filteredRes.map(r => ({ ...r, _type: 'res' })),
    ...filteredSch.map(s => ({ ...s, _type: 'sch' }))
  ].sort((a, b) => a.time.localeCompare(b.time));

  if (combined.length === 0) {
    list.innerHTML = '<div class="empty-state"><div class="emoji">📭</div><p>이 날 일정이 없습니다<br><span style="font-size:12px">+ 일정 추가로 등록해보세요</span></p></div>';
    return;

      return `
      <div class="slot-card res-slot">
        <span class="slot-badge res">🏋️ 운동예약</span>
        <div class="slot-time">${item.time}</div>
        ${item.type ? `<div class="slot-name">${item.type}</div>` : ''}
        <div class="slot-meta">${item.instructor ? '👤 '+item.instructor : ''}${item.memo ? ' · 📝 '+item.memo : ''}</div>

        <div class="slot-meta">${item.place ? '📍 '+item.place : ''}${item.memo ? ' · 📝 '+item.memo : ''}</div>

// ── 기록 ────────────────────────────────────────────
function renderHistory() {
  const list = document.getElementById('historyList');
  if (history.length === 0) {
    list.innerHTML = '<div class="empty-state"><div class="emoji">📝</div><p>기록이 없습니다</p></div>';
    return;
  }
  const intensityLabel = { low: '🟢 저강도', mid: '🟡 중강도', high: '🔴 고강도' };
  list.innerHTML = history.map(h => {
    const done   = h.exercises.filter(e => e.done).length;
    const exList = h.exercises.map(e => e.name).join(', ');
    return `
    <div class="log-card">
      <div class="log-date">${h.dateStr || h.date} · ${h.completedAt || ''}</div>
      ${h.instructor ? `<div class="log-instructor">👤 ${h.instructor}</div>` : ''}
      <div class="log-exercises">
        ${exList || '운동 없음'}
        <span style="color:var(--text-muted);font-size:12px"> (${done}/${h.exercises.length}개 완료)</span>
      </div>
      <div>
        ${h.intensity ? `<span class="log-intensity ${h.intensity}">${intensityLabel[h.intensity]}</span>` : ''}
        ${h.ticketName ? `<span class="log-ticket">🎫 ${h.ticketName}</span>` : ''}
      </div>
      ${h.memo ? `<div class="log-memo">📝 ${h.memo}</div>` : ''}
    </div>`;
  }).join('');
}

// ── 통계 ────────────────────────────────────────────
function renderStats() {
  const now = new Date();
  const thisMonth = todayStr.substring(0, 7);
  const weekStart = new Date(now); weekStart.setDate(now.getDate() - now.getDay());
  const weekStr = weekStart.toISOString().split('T')[0];

  document.getElementById('statTotal').textContent = history.length;
  document.getElementById('statMonth').textContent = history.filter(h => h.date.startsWith(thisMonth)).length;
  document.getElementById('statWeek').textContent  = history.filter(h => h.date >= weekStr).length;

  let streak = 0;
  const sorted = [...new Set(history.map(h => h.date))].sort().reverse();
  const check  = new Date(now);
  for (const d of sorted) {
    const ds = check.toISOString().split('T')[0];
    if (d === ds) { streak++; check.setDate(check.getDate() - 1); } else break;
  }
  document.getElementById('statStreak').textContent = streak;

  const total    = history.filter(h => h.intensity).length;
  const countLow = history.filter(h => h.intensity === 'low').length;
  const countMid = history.filter(h => h.intensity === 'mid').length;
  const countHigh= history.filter(h => h.intensity === 'high').length;
  const pct = n => total ? Math.round(n / total * 100) : 0;
  document.getElementById('pctLow').textContent  = pct(countLow)  + '%';
  document.getElementById('pctMid').textContent  = pct(countMid)  + '%';
  document.getElementById('pctHigh').textContent = pct(countHigh) + '%';
  document.getElementById('barLow').style.width  = pct(countLow)  + '%';
  document.getElementById('barMid').style.width  = pct(countMid)  + '%';
  document.getElementById('barHigh').style.width = pct(countHigh) + '%';

  const exCount = {};
  history.forEach(h => h.exercises.forEach(e => { exCount[e.name] = (exCount[e.name] || 0) + 1; }));
  const top5 = Object.entries(exCount).sort((a, b) => b[1] - a[1]).slice(0, 5);
  const topEl = document.getElementById('topExercises');
  if (top5.length === 0) {
    topEl.innerHTML = '<div style="color:var(--text-muted);font-size:13px;text-align:center;padding:10px">기록이 없습니다</div>';
  } else {
    const maxCnt = top5[0][1];
    topEl.innerHTML = top5.map(([name, cnt], i) => `
    <div style="margin-bottom:10px">
      <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:3px">
        <span>${i+1}. ${name}</span><span style="color:var(--text-muted)">${cnt}회</span>
      </div>
      <div class="progress-bar"><div class="progress-fill" style="width:${Math.round(cnt/maxCnt*100)}%"></div></div>
    </div>`).join('');
  }
}
